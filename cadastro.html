    <div class="formulariocadastro"> 
        <h2>Cadastro</h2> 
        <form>
             <label class="nomecadastro" for="nome"> Digite seu nome: </label><br>
              <input type="text" id="nome" placeholder="Nome:"><br>
               <label class="nomecadastro" for="tipo">Escolha seu usuario: </label><br> 
               <input list="user" type="text" id="tipo" placeholder="Digite aqui..."><br> 
               <datalist id="user"> <option>Aluno</option> <option>Professor</option>
             </datalist> <label class="nomecadastro" for="matricula">Digite sua matricula: </label><br>
              <input type="text" id="matricula" placeholder="Matricula: "><br>
               <label class="nomecadastro" for="senha">Crie uma senha: </label><br>
                <input type="password" id="senha" placeholder="Senha:"><br> 
                <input class="enviar" type="submit" placeholder="criar conta"><br> 
                <a class="link" href="login.html"><p> possui uma conta?</p> fazer login.</a>
     </form>
    </div>
