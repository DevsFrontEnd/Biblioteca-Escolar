<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <img src="imgs/index/iconeselim.png" alt="Icone da Escola">
        <h1>E.E Selim José de Salles</h1>
        <nav>
            <a href="menu.html">Menu</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main class="cadastro">
            <section class="formulario">
                <form>
                    <h1>Cadastro</h1><br>
                    <label for="nome-cadastro">Nome Completo: </label><br>
                    <input name="nome-cadastro" placeholder="Nome" id="nome-cadastro" type="text"><br><br>
                    <label for="matricula-cadastro">Matrícula: </label><br>
                    <input name="matricula-cadastro" placeholder="Matrícula" id="matricula-cadastro" type="text"><br><br>
                    <label for="email-cadastro">Email: </label><br>
                    <input name="email-cadastro" placeholder="Email" id="email-cadastro" type="text"><br><br>
                    <label for="senha">Senha: </label><br>
                    <input name="senha-cadastro" placeholder="Senha" id="senha-cadastro" type="password"><br><br>
                    <input value="Cadastrar" type="submit"><br><br>
                    <a href="login.html">Já possui uma conta? Fazer Login.</a>
                </form>
            </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Biblioteca Selim. Todos os direitos reservados.</p>
        <p>📍 Ipatinga - MG</p>
        <p>📧 biblioteca@escola.com</p>
    </footer>
</body>
</html>
